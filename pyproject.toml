[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vinted-watch"
version = "0.2.0"
description = "Poll Vinted searches and push new listings to ntfy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
vinted-watch = "vinted_watch.main:main"

[tool.setuptools]
packages = ["vinted_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
